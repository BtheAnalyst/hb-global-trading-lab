name: Stock & ETF engine (manual only)
# No schedule on purpose: unattended scheduled orders stay disabled until a separate Gate 5 approval.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only dry run | shadow = research portfolios only | paper = research + Founder's Account paper orders | harden = paper-account backstops | resume = owner restart"
        required: true
        default: check
        type: choice
        options: [check, shadow, paper, harden, resume]
      pid:
        description: "resume only: portfolio id (e.g. FOUNDER) or GLOBAL"
        required: false
        default: ""
      reason:
        description: "resume only: why it is safe to restart"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: equity-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Engine (Alpaca PAPER only; no real money)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          PID: ${{ inputs.pid }}
          REASON: ${{ inputs.reason }}
        run: python scripts/run_equity.py --mode "${{ inputs.mode }}" --manual --pid "$PID" --reason "$REASON"
      - name: Save books (always, so a failed run's partial books are kept for recovery)
        if: always() && inputs.mode != 'check' && inputs.mode != 'harden'
        run: |
          git config user.name "hb-atelier-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/equity_state.json state/equity_journal.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Equity engine ${{ inputs.mode }} pass" && git pull --rebase && git push)
