name: Intraday engine (paper)
# Long-running session job (GitHub's cron is hours late for this repo, so the engine itself keeps the clock):
# a morning job until 12:30 ET, then an afternoon job until 16:05 ET that flattens and writes the daily report.
# Started each weekday ~9:10 ET by a Claude scheduled task; the cron below is only a late backup.
# mode/execute come from config/intraday.yaml. Alpaca PAPER only; live trading is blocked in code.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 13 * * 1-5"         # backup 9:05 EDT
concurrency:
  group: intraday-engine
  cancel-in-progress: false
permissions:
  contents: write
  issues: write          # the daily intraday report is posted as an issue assigned to the founder (GitHub emails it)
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: git config user.name "HB Atelier Bot" && git config user.email "atelier-bot@users.noreply.github.com"
      - name: Morning session (to 12:30 ET)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: python scripts/run_intraday.py --until 12:30
  afternoon:
    needs: morning
    if: ${{ !cancelled() }}        # run even if the morning job FAILED (positions must still be managed/flattened); not when cancelled
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: git config user.name "HB Atelier Bot" && git config user.email "atelier-bot@users.noreply.github.com"
      - name: Afternoon session, flatten, daily report (to 16:05 ET)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: python scripts/run_intraday.py --until 16:05 --final
      - name: Post the intraday daily report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/intraday_report.py || exit 0
          gh label create intraday-report --color 2F3A22 --description "Intraday paper trading report" 2>/dev/null || true
          title="Intraday paper report · $(TZ=America/New_York date +'%a %b %-d, %Y')"
          if gh issue list --label intraday-report --state all --limit 30 --json title -q '.[].title' | grep -qxF "$title"; then
            echo "already posted"; exit 0
          fi
          gh issue create --title "$title" --body-file intraday_report.md --label intraday-report --assignee "${{ github.repository_owner }}"
