name: Atelier paper trading
on:
  schedule:
    # Every 30 min on weekdays at :04 and :34 past the hour, 13:04-21:34 UTC
    # = 9:04 AM-5:34 PM EDT (8:04 AM-4:34 PM EST after Nov 1), covering the 9:30-4:00 ET session.
    # Off the top of the hour on purpose: GitHub delays or drops scheduled runs most at :00/:30.
    # The bot itself checks Alpaca's market clock, so off-hours runs and holidays place no orders.
    - cron: "4,34 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "trade (normal) or scan (dry run, never sends orders)"
        default: scan
        type: choice
        options: [scan, trade]
concurrency:
  group: atelier-state       # never two runs at once
  cancel-in-progress: false
permissions:
  contents: write            # to save the bot's state file
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt alpaca-py
      - name: Run the Atelier (paper only)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: python scripts/run_bot.py ${{ inputs.mode || 'trade' }}
      - name: Save state
        if: always()          # also after a failed run, so a sent order is never forgotten
        run: scripts/save_state.sh "${{ inputs.mode || 'trade' }}" state/
