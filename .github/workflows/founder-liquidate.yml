name: Founder - liquidate ETF holdings (founder-approved, paper)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "founder approval / reason"
        required: true
permissions:
  contents: write
concurrency:
  group: equity-engine           # never at the same time as the ETF engine writing the same books
  cancel-in-progress: false
jobs:
  sell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sell (Alpaca PAPER)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          REASON: ${{ inputs.reason }}
        run: python scripts/liquidate_founder.py --reason "$REASON"
      - name: Save books (always)
        if: always()
        run: |
          git config user.name "HB Atelier Bot"; git config user.email "atelier-bot@users.noreply.github.com"
          git add state/equity_state.json state/equity_journal.jsonl
          git diff --cached --quiet || (git commit -m "Founder ETF liquidation (founder-approved)" && git pull --rebase && git push)
