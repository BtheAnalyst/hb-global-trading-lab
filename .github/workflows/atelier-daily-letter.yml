name: Atelier Daily Letter
on:
  schedule:
    - cron: "15 21 * * 1-5"        # 5:15 PM EDT / 4:15 PM EST, after the close
  workflow_dispatch:
concurrency:
  group: atelier-state
  cancel-in-progress: false
permissions:
  contents: write
  issues: write                    # the letter is posted as an issue, which GitHub sends to Haley
jobs:
  letter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest saved state, not the commit this run was queued on (runs queue behind each other)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_bot.py letter
      - name: Post the Daily Letter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-letter --color 4A5A32 --description "HB Global Daily Letter" 2>/dev/null || true
          title="The Daily Letter · $(TZ=America/New_York date +'%a %b %-d, %Y')"
          if gh issue list --label daily-letter --state all --limit 30 --json title -q '.[].title' | grep -qxF "$title"; then
            echo "Today's Letter is already posted; not posting twice."; exit 0
          fi
          gh issue create --title "The Daily Letter · $(TZ=America/New_York date +'%a %b %-d, %Y')" \
            --body-file letter.md --label daily-letter --assignee "${{ github.repository_owner }}"
      - name: Export numbers for the Atelier dashboard
        run: python scripts/export_dashboard.py
      - name: Save state
        run: scripts/save_state.sh letter state/ dashboard/*.json dashboard/letter_email.html dashboard/letter_subject.txt
